name: CI
on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'main' && !contains(github.ref, 'release/') }}
jobs:
  build:
    name: Code Quality
    timeout-minutes: 15
    runs-on: ubuntu-latest
    env:
      DO_NOT_TRACK: '1'
    steps:
      - id: checkout
        name: Check out code
        uses: actions/checkout@v5
        with:
          fetch-depth: 2
          lfs: true
      - id: setup-bun
        name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - id: install
        name: Install dependencies
        run: bun install
      - id: checks
        name: Code Quality Checks
        run: bun turbo check lint test --continue
      - id: ensure-clean
        name: Ensure there are no uncommitted changes
        run: git diff --exit-code || (echo "There are uncommitted changes!" && exit 1)
      - id: changesets
        if: ${{ github.event_name == 'push' }}
        name: Changesets
        uses: changesets/action@v2
        with:
          commit-message: 'chore: Update versions'
          pr-title: 'chore: Update versions'
          publish-script: bun run changesets:publish
          version-script: bun run changesets:version
          github-token: ${{ secrets.CHANGESETS_GITHUB_TOKEN }}
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
